<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HR Assistant Chatbot</title>
    <style>
        :root { --primary-color: #2563eb; --bg-color: #f8fafc; --card-bg: #ffffff; --text-color: #1e293b; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); color: var(--text-color); margin: 0; padding: 20px; display: flex; justify-content: center; align-items: center; min-height: 90vh; }
        .chat-container { width: 100%; max-width: 600px; background: var(--card-bg); border-radius: 12px; box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1); display: flex; flex-direction: column; height: 80vh; }
        .chat-header { background: var(--primary-color); color: white; padding: 1rem; border-top-left-radius: 12px; border-top-right-radius: 12px; text-align: center; font-weight: bold; }
        .chat-messages { flex: 1; padding: 1rem; overflow-y: auto; display: flex; flex-direction: column; gap: 0.75rem; }
        .message { padding: 0.75rem 1rem; border-radius: 8px; max-width: 80%; line-height: 1.5; white-space: pre-wrap; }
        .user-message { background: #e2e8f0; align-self: flex-end; color: var(--text-color); }
        .bot-message { background: #dbeafe; align-self: flex-start; color: #1e40af; }
        .chat-input-area { padding: 1rem; border-top: 1px solid #e2e8f0; display: flex; gap: 0.5rem; }
        input[type="text"] { flex: 1; padding: 0.75rem; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 1rem; outline: none; }
        button { background: var(--primary-color); color: white; border: none; padding: 0.75rem 1.25rem; border-radius: 6px; font-weight: bold; cursor: pointer; }
        button:hover { background-color: #1d4ed8; }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">HR Assistant Chatbot</div>
        <div class="chat-messages" id="chatMessages">
            <div class="message bot-message">Hello! How can I help you with our HR policies and handbook today?</div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="userInput" placeholder="Ask an HR question..." onkeypress="handleKeyPress(event)">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        async function sendMessage() {
            const input = document.getElementById('userInput');
            const message = input.value.trim();
            if (!message) return;

            const chatMessages = document.getElementById('chatMessages');

            // Add User Message
            const userDiv = document.createElement('div');
            userDiv.className = 'message user-message';
            userDiv.textContent = message;
            chatMessages.appendChild(userDiv);

            input.value = '';
            chatMessages.scrollTop = chatMessages.scrollHeight;

            // Add Thinking Indicator
            const botDiv = document.createElement('div');
            botDiv.className = 'message bot-message';
            botDiv.textContent = 'Thinking...';
            chatMessages.appendChild(botDiv);
            chatMessages.scrollTop = chatMessages.scrollHeight;

            try {
                const response = await fetch('https://adsgd.app.n8n.cloud/webhook/handbook-chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ question: message })
                });

                const data = await response.json();
                
                // Extract clean answer text
                let cleanAnswer = data.answer || data.output || data.response || data.text;
                if (!cleanAnswer && typeof data === 'object') {
                    cleanAnswer = JSON.stringify(data, null, 2);
                }

                // Clean up newlines for display
                botDiv.textContent = cleanAnswer.replace(/\\n/g, '\n');

            } catch (error) {
                botDiv.textContent = 'Sorry, I encountered an error connecting to the HR server.';
            }
            chatMessages.scrollTop = chatMessages.scrollHeight;
        }

        function handleKeyPress(event) {
            if (event.key === 'Enter') sendMessage();
        }
    </script>
</body>
</html>
